<!doctype html>
<meta charset="utf-8">
<title>handwave: whiteboard tutor</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{"imports": {
  "roughjs": "/node_modules/roughjs/bundled/rough.esm.js",
  "perfect-freehand": "/node_modules/perfect-freehand/dist/esm/index.mjs"

<link rel="stylesheet" href="/lib/page.css">
<style>
  @font-face { font-family: Excalifont; src: url(/lib/fonts/Excalifont-Regular.ttf); }
  @font-face { font-family: Nunito; src: url(/lib/fonts/Nunito-Regular.ttf); }
  body { display: flex; flex-direction: column; font-family: Excalifont, sans-serif; color: #1B2547; }
  canvas#stage { flex: 1 1 0; height: 0; min-height: 0; width: 100%; }
  #caption { min-height: 2.6em; padding: 4px 40px; font: 26px/1.3 Nunito, sans-serif; text-align: center; }
  #pointing { min-height: 1.4em; padding: 0 40px; font-size: 20px; color: #a35200; text-align: center; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 40px 14px; }
  #bar input, #bar button, #bar select { font: 22px Excalifont, sans-serif; color: #1B2547; background: #fff; border: 2px solid #1B2547; border-radius: 12px; padding: 8px 14px; }
  #question { flex: 1; min-width: 0; }
  #bar button { cursor: pointer; background: #d0ebff; border-color: #1864ab; color: #1864ab; }
  #bar button.quiet, #bar select { background: #f1f3f5; border-color: #343a40; color: #343a40; }
  #mic[aria-pressed="true"] { background: #ffe3e3; border-color: #c92a2a; color: #c92a2a; }
  #meter { font-size: 18px; color: #7A776E; text-align: right; min-width: 15em; }
  #bar input:focus-visible, #bar button:focus-visible, #bar select:focus-visible { outline: 3px solid #fff3bf; outline-offset: 1px; }
</style>
<canvas id="stage"></canvas>
<div id="caption" aria-live="polite"></div>
<div id="pointing"></div>
<form id="bar">
  <button type="button" id="mic" aria-pressed="false" class="quiet" hidden>talk</button>
  <input id="question" autocomplete="off" placeholder="Ask anything. Click the board to point at something." aria-label="Your question">
  <button id="ask">ask</button>
  <button type="button" id="stop" class="quiet" title="Stop talking (Esc)">stop</button>
  <button type="button" id="new-board" class="quiet">new board</button>
  <select id="model" aria-label="Model">
    <option value="claude-haiku-5-5">Haiku</option>
    <option value="claude-sonnet-5-5">Sonnet</option>
  </select>
  <div id="meter"></div>
</form>
<script type="module" src="./main.js"></script>
